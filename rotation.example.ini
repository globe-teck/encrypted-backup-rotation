# Copy to rotation.ini (git-ignored) and edit. All values below are examples.
[remote]
type = ssh
host = backup.example.com
user = backupuser
port = 22
path = /home/backupuser/backups
pattern = backup-*.tar.gz
retries = 5
retry_wait = 30

[local]
path = ~/Backups/site

[cloud]
type = rclone
# any rclone remote, e.g. a Google Drive remote named "gdrive"
dest = gdrive:Backups/site

[encryption]
iterations = 200000
# macOS: passphrase in the login Keychain
passphrase_source = keychain
keychain_service = backup-rotation
keychain_account = backupuser
# Linux: passphrase in a chmod 600 file
# passphrase_source = file
# passphrase_file = ~/.config/backup-rotation/passphrase
